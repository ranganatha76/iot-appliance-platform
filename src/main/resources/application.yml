spring:
  datasource:
    url: jdbc:h2:mem:appliances;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
collection:
  scheduler-delay-ms: 5000
vendors:
  acme:
    bearer-token: local-acme-bearer-token
  northwind:
    api-key: local-northwind-api-key
    max-requests-per-minute: 60
    fail-every-requests: 0